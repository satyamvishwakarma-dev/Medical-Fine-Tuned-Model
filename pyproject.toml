description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satyam Vishwakarma", email = "officialsatyamvishwakarma06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "gradio>=6.26.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.17",
    "numpy>=2.5.2",
